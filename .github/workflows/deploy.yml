name: Deploy Multiple Versions to GitHub Pages

on:
  push:
    branches:
      - 'release/*'
      - 'main'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Берёт имя ветки (например, refs/heads/release/dev), очищает её до "dev" и сохраняет в переменную ENV_NAME
      - name: Configure Deployment Paths
        id: config
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          ENV_NAME="${BRANCH_NAME##*/}"
          
          # Если пуш идет в ветку release/prod (или release/main), то деплоим в КОРЕНЬ
          if [ "$ENV_NAME" = "prod" ] || [ "$ENV_NAME" = "main" ]; then
            echo "TARGET_FOLDER=" >> $GITHUB_ENV
            echo "BASE_HREF=/movie_collection/" >> $GITHUB_ENV
            echo "--- ДЕПЛОЙ В КОРЕНЬ САЙТА ---"
          else
            # Для всех остальных веток (например, release/dev) деплоим в подпапку
            echo "TARGET_FOLDER=$ENV_NAME" >> $GITHUB_ENV
            echo "BASE_HREF=/movie_collection/$ENV_NAME/" >> $GITHUB_ENV
            echo "--- ДЕПЛОЙ В ПОДПАПКУ: $ENV_NAME ---"
          fi

      - name: Build Web
        run: |
          flutter build web --release --base-href "/movie_collection/${{ env.ENV_NAME }}/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          # Если env.TARGET_FOLDER пустой, плагин очистит корень ветки gh-pages и положит файлы туда.
          # Если там указано "dev", он положит файлы строго в папку dev, не трогая корень.
          target-folder: ${{ env.TARGET_FOLDER }}
